# Weekly check of every link on the portfolio page.
# If anything is broken, opens (or updates) one GitHub issue listing the broken
# links, which notifies the repo owner by email, the GitHub app and the bell icon.
name: Weekly link check

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (7:17 AM Central standard time)
  workflow_dispatch:         # "Run workflow" button for an on-demand check

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links
        id: check
        run: python .github/scripts/check_links.py index.html link-report.md
        continue-on-error: true   # a broken link should open an issue, not just fail silently

      - name: Open or update the "Broken links" issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken links found on portfolio site"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
          else
            gh issue create --title "$title" --body-file link-report.md
          fi

      - name: Fail the run so the red X is visible in the Actions tab
        if: steps.check.outcome == 'failure'
        run: exit 1
